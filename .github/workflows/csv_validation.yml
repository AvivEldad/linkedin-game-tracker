name: Validate data
on: 
  pull_request:
    branches: [main]
    paths: 
      - '**/*.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-csv:
    name: validae data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: action/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installe dependencies
        run: python -m pip install pandas

      - name: Run validation script
        run: python validate_csv.py
        
  
